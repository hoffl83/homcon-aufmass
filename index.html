<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5A6E61">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Aufmaß Heizlast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Farbschema: Anthrazit #2E3133, Salbeigrün #5A6E61, Sandbeige #CEC8BC, Warmweiß #F7F6F2.
   Layout: Arbeitsblatt-Prinzip. Feste Kopfleiste mit Reitern, darunter Formularblöcke im Raster; Messwerte in Mono, Wärmeverluste in dunklem Salbeigrün. */
:root{
  --paper:#F7F6F2; --surface:#FFFFFF; --sunk:#ECE9E2; --ink:#2E3133; --muted:#62686A; --line:#D9D4C9;
  --petrol:#5A6E61; --petrol-ink:#FFFFFF; --amber:#43544A; --amber-soft:#E9E5DC; --danger:#A8322A; --ok:#4E7A5C;
  --f-display:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",Roboto,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E2122; --surface:#2E3133; --sunk:#171919; --ink:#F7F6F2; --muted:#B4AFA5; --line:#44494B;
  --petrol:#93AA9A; --petrol-ink:#1E2122; --amber:#C3D3C5; --amber-soft:#363D39; --danger:#E8857B; --ok:#93C2A1; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E2122; --surface:#2E3133; --sunk:#171919; --ink:#F7F6F2; --muted:#B4AFA5; --line:#44494B;
  --petrol:#93AA9A; --petrol-ink:#1E2122; --amber:#C3D3C5; --amber-soft:#363D39; --danger:#E8857B; --ok:#93C2A1; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:1.45rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
.num,output,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:60px}
.brand{display:flex;flex:none}.brand img{display:block;height:28px;width:auto;max-width:96px;object-fit:contain}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--muted);white-space:nowrap}
.status.warn{color:var(--danger)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 16px;font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--petrol)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--petrol)}
.btn.primary{background:var(--petrol);color:var(--petrol-ink);border-color:var(--petrol)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:0 10px;font-size:.88rem}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.icon{width:20px;height:20px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

main{padding-block:20px 80px;display:grid;gap:20px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Formular */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.f{display:grid;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>span{font-size:.8rem;color:var(--muted);font-weight:500}
.in{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.in:focus{border-color:var(--petrol);background:var(--surface)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:auto}
.unit{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* Projektliste */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--petrol)}
.pcard .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.badge{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--amber-soft);color:var(--amber)}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Räume */
.rooms{display:grid;gap:8px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.rcard:hover{border-color:var(--petrol)}
.rcard .nm{font-weight:600}
.rcard .val{font-family:var(--f-mono);color:var(--amber);font-weight:500;text-align:right}
.bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.sum{display:flex;gap:28px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--amber-soft)}
.sum div{display:grid}
.sum b{font-family:var(--f-mono);font-size:1.35rem;color:var(--amber);font-weight:500}

/* Bauteile */
.bts{display:grid;gap:10px}
.bt{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;background:var(--surface)}
.bt.opening{border-left-color:var(--petrol);margin-left:18px}
.bt-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt-top select.in{width:auto;min-width:170px;flex:0 1 auto}
.bt-top .bez{flex:1 1 160px}
.bt-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px 10px}
.bt-fields .f>span{font-size:.72rem}
.bt-fields .f.w2{grid-column:span 2}
.bt-res{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.bt-res output{font-weight:500}
.bt-res .phi{color:var(--amber)}
.bt-res .sp{flex:1}
.addbar{display:flex;gap:8px;flex-wrap:wrap}

/* Tabellen */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
td.hl{color:var(--amber)}
tr.grp td{font-weight:600;background:var(--sunk);border-top:1px solid var(--line)}
tr.sub td{font-weight:600;border-bottom:2px solid var(--line)}

/* Wärmepumpen-Eignung */
.wp-ok{color:var(--ok)!important}
.wp-amber{color:var(--ink)!important}
.wp-danger{color:var(--danger)!important}
td.warn{color:var(--danger);font-weight:600}
td.wrap{white-space:normal;min-width:180px}

/* Plausibilität */
.pl-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pl-list li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-radius:var(--r);background:var(--sunk);font-size:.92rem}
.pl-list li>span:nth-child(2){flex:1;min-width:0}
.pl-tag{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.pl-f .pl-tag{background:var(--danger);color:var(--surface)}
.pl-w .pl-tag{background:var(--ink);color:var(--surface)}
.pl-i .pl-tag{background:var(--line);color:var(--ink)}
.pl-badge{font-size:.78rem;font-weight:600;color:var(--danger);white-space:nowrap}
#plausroom:empty{display:none}

/* Version */
.ver{text-align:center;font-size:.8rem;margin:24px 0 8px;font-family:var(--f-mono)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
  background:var(--ink);color:var(--paper);padding:8px 8px 8px 16px;border-radius:var(--r);width:max-content;max-width:calc(100% - 32px)}

/* Checkboxen */
.chks{display:flex;flex-wrap:wrap;gap:4px 18px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--petrol);margin:0}
.sub-h{font-size:.95rem;margin:16px 0 4px;font-weight:600}
.fcheck{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.fcheck .fc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.fcheck .fc.ok{border-color:var(--ok)}
.fcheck .fc .st{font-size:.85rem;color:var(--muted)}
.fcheck .fc.ok .st{color:var(--ok);font-weight:600}

/* Laser */
.laser .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.laser.an .dot{background:var(--ok)}
.laser.verbinde .dot{background:var(--amber)}
.laser.fehler .dot,.laser.getrennt .dot{background:var(--danger)}
.laserhit{outline:3px solid var(--ok);outline-offset:1px}
.lasermeter{font-family:var(--f-mono);font-size:2rem;color:var(--amber)}
.laserlog{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);padding:8px 10px;border-radius:var(--r);max-height:180px;overflow:auto;white-space:pre;margin:0}

/* Raum aus Maßen */
.geo summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.geo summary::-webkit-details-marker{display:none}
.geo summary::after{content:"▾";color:var(--muted)}
.geo[open] summary::after{content:"▴"}
.geo summary h2{margin:0}
.geo .grid{margin-top:12px}

/* Wohneinheiten */
.we-head{display:grid;grid-template-columns:minmax(140px,1fr) minmax(140px,1fr) auto;gap:8px;align-items:end}
.we-head .tot{font-family:var(--f-mono);color:var(--amber);font-weight:500;white-space:nowrap;padding-bottom:10px}
@media (max-width:600px){ .we-head{grid-template-columns:1fr} .we-head .tot{padding-bottom:0} }

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:grid}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunk)}
.ph .pc{padding:8px;display:grid;gap:6px}
.ph .in{min-height:38px;font-size:.88rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note a{color:var(--petrol)}
.plzhint{border-left-color:var(--petrol)}
.plzhint .row{margin-top:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.banner{background:var(--amber-soft);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:.9rem}

/* Dialog */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:var(--r);padding:18px;width:min(720px,100%);max-height:90vh;display:grid;gap:12px;grid-template-rows:auto 1fr auto}
.dlg textarea{min-height:240px;font-family:var(--f-mono);font-size:.78rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);z-index:30;font-size:.9rem}

@media (max-width:600px){ .bt.opening{margin-left:8px} .sum{gap:18px} }
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .25s ease} }
@media print{
  .top,.noprint{display:none!important} body{background:#fff;color:#000} .block{border:0;padding:0}
  body.printing>*:not(#printroot){display:none!important}
}
/* Aufnahmeprotokoll – nur im Druck sichtbar, immer hell */
#printroot{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm 18mm}
  body.printing #printroot{display:block;color:#2E3133;background:#fff;font:9.5pt/1.4 var(--f-body,"IBM Plex Sans",system-ui,sans-serif)}
  #printroot h1{font-size:16pt;margin:10px 0 8px}
  #printroot h2{font-size:12.5pt;margin:16px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #5A6E61;break-after:avoid}
  #printroot h3{font-size:10.5pt;margin:12px 0 4px;break-after:avoid}
  #printroot h4{font-size:10pt;margin:0 0 2px}
  #printroot h4 span{font-weight:400;color:#62686A;font-size:8.5pt}
  #printroot section{break-inside:auto}
  #printroot table{width:100%;border-collapse:collapse;margin:2px 0 8px;font-size:8.5pt}
  #printroot th,#printroot td{padding:2px 5px;border-bottom:.5px solid #D9D4C9;text-align:left;vertical-align:top;white-space:normal}
  #printroot thead th{font-size:7.5pt;text-transform:uppercase;letter-spacing:.04em;color:#62686A;border-bottom:1px solid #2E3133}
  #printroot td.n,#printroot th.n{text-align:right;font-variant-numeric:tabular-nums}
  #printroot tfoot td{border-top:1px solid #2E3133;font-weight:600}
  #printroot tr{break-inside:avoid}
  #printroot tr.pr-sub td{color:#4b5153}
  #printroot table.kv th{width:38%;font-weight:500;color:#62686A;font-size:8.5pt;text-transform:none;letter-spacing:0}
  .pr-bk{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:10px;border-bottom:1.5px solid #5A6E61;margin-bottom:18px}
  .pr-marke{display:flex;gap:12px;align-items:center}
  .pr-logo{height:16mm;max-width:45mm;object-fit:contain}
  .pr-firma{font-family:var(--f-display);font-size:22pt;font-weight:600;line-height:1;color:#2E3133;letter-spacing:.01em}
  .pr-zusatz{font-size:8pt;color:#5A6E61;margin-top:4px;max-width:85mm}
  .pr-bk address{font-style:normal;font-size:8pt;line-height:1.45;text-align:right;color:#4b5153}
  .pr-titel{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .pr-titel h1{margin:0!important}
  .pr-titel div{font-size:9.5pt;color:#4b5153}
  #printroot table.pr-objekt{margin-bottom:6px;background:#F7F6F2}
  #printroot table.pr-objekt th{width:16%;font-weight:500;color:#62686A;text-transform:none;letter-spacing:0;font-size:8.5pt;border:0;padding:4px 6px}
  #printroot table.pr-objekt td{width:34%;border:0;padding:4px 6px}
  .pr-rk{font-size:8.5pt;color:#4b5153;margin-bottom:3px}
  .pr-room{break-inside:avoid-page;margin:8px 0 10px}
  .pr-small{font-size:8pt;color:#62686A;margin:2px 0 6px}
  .pr-we{margin-top:14px}
  .pr-list{margin:2px 0 8px;padding-left:16px}
  .pr-fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pr-fgrid figure{margin:0;break-inside:avoid}
  .pr-fgrid img{width:100%;max-height:75mm;object-fit:contain;background:#F7F6F2;display:block}
  .pr-fgrid figcaption{font-size:8pt;margin-top:2px}
  .pr-sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px;break-inside:avoid;font-size:8pt;color:#62686A}
  .pr-sig span{display:block;border-bottom:1px solid #2E3133;height:34px;margin-bottom:4px}
  .pr-foot{margin-top:22px;padding-top:5px;border-top:1px solid #5A6E61;font-size:7.5pt;color:#62686A;text-align:center}
  #printroot h2{color:#5A6E61}
}
</style>
</head>

/* ============ Laser-Entfernungsmesser (Web Bluetooth) ============ */
// Bosch-Laser senden Rahmen C0 55 <Länge> <Nutzdaten> <CRC-8 (Poly 0xA6, Start 0xAA)>. Nutzdaten: Typ (2 Byte LE),
// Zähler (2 Byte LE), Wert float32 LE. Typ 0x0006 = Distanz in m. Nicht offiziell dokumentiert; nach Community-Analysen
// von AdvancedDistance 50C (Service 0xFDE8) und GLM 50 C (Service 02a6c0d0). Der UniversalDistance 40C meldet
// stattdessen Service 00005301-…-534f46540000 mit einer Characteristic 00004301 (Write + Indicate), ausgelesen
// über chrome://bluetooth-internals; das Rahmenformat dort ist noch unbestätigt – Rohdaten zeigt der Laser-Dialog.
const LASER_SVC=["00005301-0000-0041-5253-534f46540000",0xfde8,"02a6c0d0-0451-4000-b000-fb3210111989"];
const LASER_INIT=new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]);
const L={dev:null,ch:null,state:"aus",info:"",log:[],steps:[],last:null,cnt:null,crc:null,field:null,next:true,manual:false,tries:0};
// Nur Felder, die eine Länge in Metern erwarten
const isLenField=el=>!!el&&el.tagName==="INPUT"&&(["b","h"].includes(el.dataset.bf)||/\.geo\.(l|b|gh)$|^raeume\.\d+\.h$/.test(el.dataset.bind||""));
const fieldSel=el=>el.dataset.bind?`[data-bind="${el.dataset.bind}"]`:`[data-bt="${el.closest("[data-bt]").dataset.bt}"] [data-bf="${el.dataset.bf}"]`;
function crc8(bytes){ let c=0xAA; for(const x of bytes){ c^=x; for(let i=0;i<8;i++) c=c&0x80?((c<<1)^0xA6)&0xFF:(c<<1)&0xFF; } return c; }
// Rahmen zerlegen; null, wenn es kein Messrahmen ist
function laserParse(dv){ const b=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
  if(b.length<12||b[0]!==0xC0||b[2]+4!==b.length) return null;
  return {typ:b[3]|b[4]<<8, cnt:b[5]|b[6]<<8, v:dv.getFloat32(7,true), crc:crc8(b.subarray(0,b.length-1))===b[b.length-1]}; }
function laserFrame(dv){ const b=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
  L.log.unshift([...b].map(x=>x.toString(16).padStart(2,"0")).join(" ")); L.log.length=Math.min(L.log.length,12);
  const f=laserParse(dv); if(f) L.crc=f.crc;
  // Nur Distanzen; der Zähler filtert doppelt gesendete Rahmen
  if(!f||f.typ!==6||f.cnt===L.cnt||!isFinite(f.v)||f.v<=0||f.v>250){ laserPaint(); return; }
  L.cnt=f.cnt; laserValue(f.v); }
// Aktives Maßfeld, sonst das zuletzt benutzte; ein anderes aktives Eingabefeld (z. B. U-Wert) blockiert
function laserTarget(){ const a=document.activeElement; if(isLenField(a)) return a;
  if(a&&$("#app").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return "kein";
  return L.field?document.querySelector(L.field):null; }
function laserValue(v){ L.last=v; const s=v.toFixed(3).replace(".",","), el=laserTarget();
  if(el==="kein"){ toast("Messung "+s+" m – dieses Feld erwartet keine Länge"); laserPaint(); return; }
  if(!el){ toast("Messung "+s+" m – erst ein Maßfeld antippen"); laserPaint(); return; }
  el.value=s; el.dispatchEvent(new Event("input",{bubbles:true}));
  const hit=document.querySelector(fieldSel(el))||el; hit.classList.add("laserhit"); setTimeout(()=>hit.classList.remove("laserhit"),900);
  if(L.next){ const all=[...document.querySelectorAll("#app input")].filter(isLenField), nx=all[all.indexOf(hit)+1];
    if(nx){ nx.focus({preventScroll:false}); L.field=fieldSel(nx); } }
  toast(s+" m übernommen"); laserPaint(); }
async function laserConnect(){
  try{ L.dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:LASER_SVC}); }
  catch(e){ if(e.name!=="NotFoundError") toast("Bluetooth: "+e.message); return; }
  L.manual=false; L.tries=0; L.dev.addEventListener("gattserverdisconnected",laserLost); await laserOpen(); }
// Jeder Schritt landet im Protokoll der Diagnose, damit sich ein Abbruch am Gerät nachvollziehen lässt
const laserStep=t=>{ L.steps.push(new Date().toLocaleTimeString("de-DE")+"  "+t); laserPaint(); };
const withTimeout=(pr,ms,what)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+": keine Antwort nach "+ms/1000+" s")),ms))]);
const propTxt=c=>Object.entries({read:"R",write:"W",writeWithoutResponse:"w",notify:"N",indicate:"I"}).filter(([k])=>c.properties[k]).map(([,v])=>v).join("");
async function laserOpen(){ if(!L.dev) return; L.state="verbinde"; L.info=""; L.steps=[]; laserPaint();
  try{ laserStep(`Verbinde mit „${L.dev.name||"unbenannt"}“ (ID ${L.dev.id.slice(0,8)}) …`);
    const gatt=await withTimeout(L.dev.gatt.connect(),20000,"GATT-Verbindung"); laserStep("GATT verbunden"); let ch=null;
    for(const s of LASER_SVC){ const sn=typeof s==="number"?"0x"+s.toString(16).toUpperCase():s.slice(0,8);
      try{ const cs=await withTimeout((await withTimeout(gatt.getPrimaryService(s),10000,"Service "+sn)).getCharacteristics(),10000,"Characteristics "+sn);
        laserStep(`Service ${sn}: gefunden – ${cs.map(c=>c.uuid.slice(0,8)+"("+propTxt(c)+")").join(", ")||"keine Characteristics"}`);
        ch=cs.find(c=>/^(02a6c0d|00004301)/.test(c.uuid)&&(c.properties.notify||c.properties.indicate))||cs.find(c=>c.properties.notify||c.properties.indicate); if(ch) break;
      }catch(e){ laserStep(`Service ${sn}: ${e.name==="NotFoundError"?"nicht vorhanden":e.name+" – "+e.message}`); } }
    if(!ch){ L.state="fehler"; L.info="Kein bekannter Bosch-Messdienst gefunden – Protokoll unter „Diagnose“ an den Entwickler."; L.manual=true; try{ L.dev.gatt.disconnect() }catch(x){} laserPaint(); return; }
    L.ch=ch; ch.addEventListener("characteristicvaluechanged",e=>laserFrame(e.target.value));
    await withTimeout(ch.startNotifications(),10000,"Benachrichtigungen"); laserStep("Benachrichtigungen aktiv auf "+ch.uuid.slice(0,8));
    try{ await (ch.properties.writeWithoutResponse?ch.writeValueWithoutResponse(LASER_INIT):ch.writeValue(LASER_INIT)); laserStep("Startbefehl gesendet"); }
    catch(e){ laserStep("Startbefehl nicht gesendet: "+e.name+" – "+e.message); }
    L.state="an"; L.tries=0; L.cnt=null; L.info=`${L.dev.name||"Unbenanntes Gerät"} · Service ${ch.service.uuid.slice(0,8)} · Characteristic ${ch.uuid.slice(0,8)}`; laserPaint(); toast("Laser verbunden");
  }catch(e){ laserStep("Fehler: "+e.name+" – "+e.message); L.state="fehler"; L.info="Verbindung fehlgeschlagen – Details unter „Diagnose“."; L.manual=true; try{ L.dev.gatt.disconnect() }catch(x){} laserPaint(); } }
// Laser schaltet sich nach einiger Zeit ab: dreimal neu versuchen, danach „Neu verbinden“ im Dialog
function laserLost(){ L.ch=null; if(L.manual){ if(L.state!=="fehler") L.state="aus"; laserPaint(); return; }
  L.state="getrennt"; laserPaint(); if(L.tries++<3) setTimeout(()=>{ if(!L.manual&&L.state!=="an") laserOpen(); },3000*L.tries); }
function laserOff(){ L.manual=true; try{ L.dev?.gatt.disconnect() }catch(e){} L.dev=null; L.ch=null; L.state="aus"; L.info=""; laserPaint(); }
const LASER_TXT={aus:"nicht verbunden",verbinde:"verbindet …",an:"verbunden",getrennt:"getrennt",fehler:"Fehler"};
function laserBtn(){ return `<button class="btn ghost laser ${L.state}" id="laserbtn" data-act="laser" aria-label="Laser-Entfernungsmesser: ${LASER_TXT[L.state]}">${I.bt}<span class="dot"></span></button>` }
function laserDlgBody(){
  if(!navigator.bluetooth) return `<p>Bluetooth ist in diesem Browser nicht verfügbar. Der Laser funktioniert in Chrome auf Android (oder am PC), wenn die App über HTTPS oder localhost geöffnet ist${IN_FRAME?" – nicht in dieser Vorschau":""}.</p>`;
  const tgt=L.field?document.querySelector(L.field):null, lbl=tgt?.closest("label")?.querySelector("span")?.textContent.trim();
  return `<div class="row"><span class="laser ${L.state}" style="display:inline-flex;gap:8px;align-items:center"><span class="dot"></span><b>${LASER_TXT[L.state]}</b></span><span class="muted" style="font-size:.85rem">${esc(L.info)}</span></div>
    ${L.last!=null?`<div><span class="label muted" style="font-size:.8rem">Letzte Messung</span><div class="lasermeter">${fmt(L.last,3)} m</div></div>`:""}
    <p class="muted" style="margin:0;font-size:.9rem">${tgt?`Nächste Messung geht in: <b>${esc(lbl||"Maßfeld")}</b>`:"Ein Maßfeld antippen (Breite, Höhe, Länge …) und dann am Laser messen."}</p>
    <label class="row" style="min-height:44px"><input type="checkbox" data-act="lasernext"${L.next?" checked":""} style="width:22px;height:22px"> Nach jeder Messung ins nächste Maßfeld springen</label>
    <div class="row">${L.state==="an"||L.state==="verbinde"?`<button class="btn danger" data-act="laseroff">Trennen</button>`:`<button class="btn primary" data-act="laserconn">Laser verbinden</button>${L.dev?`<button class="btn" data-act="laserre">Neu verbinden</button>`:""}`}</div>
    <p class="note">Gerät: Bosch UniversalDistance 40C (oder andere Bosch-Laser mit Bluetooth). Bluetooth am Laser einschalten und die MeasureOn-App schließen – der Laser verbindet sich nur mit einem Gerät. Übernommen werden nur Längenmessungen, keine Flächen oder Volumen.</p>
    <details${L.state==="fehler"?" open":""}><summary class="muted" style="cursor:pointer;min-height:44px;display:flex;align-items:center">Diagnose${L.crc===false?" · Prüfsumme weicht ab":""}</summary>
      <div class="sub-h" style="margin-top:4px">Verbindungsprotokoll</div><pre class="laserlog">${L.steps.length?esc(L.steps.join("\n")):"Noch kein Verbindungsversuch."}</pre>
      <div class="sub-h">Empfangene Rahmen</div><pre class="laserlog">${L.log.length?esc(L.log.join("\n")):"Noch keine Daten empfangen."}</pre>
      <button class="btn small" data-act="lasercopy" style="margin-top:8px">${I.copy}Diagnose kopieren</button></details>`; }
function laserDialog(){ $("#layer").innerHTML=`<div class="modal" data-act="close"><div class="dlg" role="dialog" aria-label="Laser-Entfernungsmesser" style="grid-template-rows:auto auto">
    <div class="block-head"><h2>Laser-Entfernungsmesser</h2><button class="btn small ghost" data-act="close">Schließen</button></div>
    <div id="laserdlg" style="display:grid;gap:12px;overflow:auto">${laserDlgBody()}</div></div></div>`; }
function laserPaint(){ const b=$("#laserbtn"); if(b) b.outerHTML=laserBtn(); const d=$("#laserdlg"); if(d){ const open=d.querySelector("details")?.open; d.innerHTML=laserDlgBody(); if(open) d.querySelector("details").open=true; } }

/* ============ Heizkörper und Vorlauftemperatur ============ */
// Norm-Wärmeleistung je Meter bei 75/65/20 °C (DIN EN 442) und Heizkörperexponent n für Flachheizkörper aus
// Buderus Planungsunterlage „Kennwerte und Wärmeleistungen von Flachheizkörpern“ 02/2002, Tab. 8/1
// (Logatrend VK-/K-Profil). Andere Fabrikate weichen etwas ab – deshalb nur Schätzwert, Typenschild geht vor.
const HK_TAB={ // Bauhöhe mm → Typ → [W/m, n]
  300:{10:[341,1.31],11:[539,1.28],21:[742,1.29],22:[1000,1.29],33:[1440,1.31]},
  400:{10:[442,1.29],11:[689,1.28],21:[925,1.30],22:[1260,1.30],33:[1795,1.32]},
  500:{10:[540,1.27],11:[828,1.29],21:[1101,1.31],22:[1506,1.32],33:[2129,1.32]},
  600:{10:[633,1.25],11:[960,1.30],21:[1273,1.31],22:[1741,1.33],33:[2449,1.33]},
  900:{10:[897,1.26],11:[1311,1.30],21:[1782,1.32],22:[2399,1.34],33:[3343,1.33]}};
const HK_TYP=[["22","Flachheizkörper Typ 22"],["21","Flachheizkörper Typ 21"],["11","Flachheizkörper Typ 11"],["10","Flachheizkörper Typ 10"],["33","Flachheizkörper Typ 33"],
  ["glied","Gliederheizkörper (Guss/Stahl)"],["bad","Badheizkörper"],["konv","Konvektor"],["sonst","sonstiger"]];
const isFlach=t=>!!HK_TAB[300][t];
// Logarithmische Übertemperatur; Normbedingung 75/65/20 °C = 49,83 K, alte Norm 90/70/20 °C (DIN 4703) = 59,44 K
const dtln=(tv,tr,ti)=>tv>tr&&tr>ti?(tv-tr)/Math.log((tv-ti)/(tr-ti)):0;
const DT_N=dtln(75,65,20), DT_90=dtln(90,70,20);
function newHk(){ return {id:uid(),typ:"22",bez:"",l:"",h:"600",anz:"",qg:"",qn:"",norm:"75",n:""} }
// Tabellenwert für Flachheizkörper, zwischen den Bauhöhen linear interpoliert
function hkTab(typ,h){ const hs=[300,400,500,600,900]; if(!isFlach(typ)||!(h>=300&&h<=900)) return null;
  const hi=hs.find(x=>x>=h), lo=[...hs].reverse().find(x=>x<=h), t=hi===lo?0:(h-lo)/(hi-lo), a=HK_TAB[lo][typ], b=HK_TAB[hi][typ];
  return {wm:a[0]+(b[0]-a[0])*t, n:a[1]+(b[1]-a[1])*t}; }
// Normleistung bei 75/65/20 °C und Exponent; src: "eingabe" | "glied" | "tabelle" | null (fehlt)
function hkNorm(hk){ const tab=hkTab(hk.typ,num(hk.h)); let n=num(hk.n); if(!(n>0)) n=tab?tab.n:1.3;
  let q=num(hk.qn), src="eingabe";
  if(!(q>0)&&hk.typ==="glied"){ q=num(hk.anz)*num(hk.qg); src="glied"; }
  if(!(q>0)&&tab&&num(hk.l)>0){ q=tab.wm*num(hk.l)/1000; src="tabelle"; }
  if(!(q>0)) return {q:NaN,n,src:null};
  if(src!=="tabelle"&&hk.norm==="90") q*=Math.pow(DT_N/DT_90,n);
  return {q,n,src}; }
function hkQ(hk,tv,tr,ti){ const {q,n}=hkNorm(hk), d=dtln(tv,tr,ti); return q>0&&d>0?q*Math.pow(d/DT_N,n):0; }
const wpZiel=p=>nz(p.anlage.wpVl,55), wpSpr=p=>Math.max(1,nz(p.anlage.wpSpreiz,5));
// Nötige Vorlauftemperatur eines Raums bei Spreizung σ: kleinste θV, bei der Σ Q ≥ Φ_HL (Bisektion bis 90 °C)
function roomVL(p,r,phi){ const hk=r.hk||[], ti=nz(r.ti,20), sp=wpSpr(p); if(!hk.length||!(phi>0)) return NaN;
  const Q=tv=>hk.reduce((s,h)=>s+hkQ(h,tv,tv-sp,ti),0); let lo=ti+sp, hi=90;
  if(Q(hi)<phi) return Infinity;
  for(let i=0;i<40;i++){ const m=(lo+hi)/2; Q(m)>=phi?hi=m:lo=m; } return hi; }
// Bewertung je Raum bei der Ziel-Vorlauftemperatur
function wpRooms(p,c){ const tv=wpZiel(p), sp=wpSpr(p);
  return p.raeume.map(r=>{ const phi=c.r[r.id].HL, hk=r.hk||[], ti=nz(r.ti,20);
    const qn=hk.reduce((s,h)=>s+(hkNorm(h).q||0),0), qz=hk.reduce((s,h)=>s+hkQ(h,tv,tv-sp,ti),0), miss=hk.some(h=>!(hkNorm(h).q>0));
    // nötige Normleistung (75/65/20) neuer Heizkörper mit n = 1,3, um Φ_HL bei Ziel-VL zu decken
    const f=Math.pow(dtln(tv,tv-sp,ti)/DT_N,1.3), need=f>0?phi/f:Infinity;
    let st; if(r.fbh==="ja"&&!hk.length) st="fbh"; else if(!(phi>0)) st="keine"; else if(!hk.length) st="ohne"; else if(miss) st="unvollst"; else st=qz>=phi?"ok":"tausch";
    return {r,phi,qn,qz,deck:phi>0?qz/phi:NaN,vl:roomVL(p,r,phi),need,st}; }); }
const WP_ST={ok:"reicht",tausch:"Heizkörper tauschen/ergänzen",ohne:"kein Heizkörper erfasst",unvollst:"Leistung fehlt",fbh:"Fußbodenheizung – nicht berechnet",keine:"keine Heizlast"};
function wpRating(vl){ if(!isFinite(vl)) return ["über 90 °C – Heizflächen reichen nicht","danger"];
  if(vl<=45) return ["sehr gut für eine Wärmepumpe","ok"]; if(vl<=55) return ["für eine Wärmepumpe geeignet","ok"];
  if(vl<=60) return ["bedingt geeignet – einzelne Heizkörper tauschen","amber"]; return ["erst Heizkörper tauschen oder Hülle verbessern","danger"]; }

/* ============ PLZ-Tabelle Norm-Außentemperatur (DIN/TS 12831-1) ============ */
// Wird auf dem Gerät gelernt (Wert aus der BWP-Klimakarte ablesen und merken) oder per CSV eingespielt.
const KLIMAKARTE="https://www.waermepumpe.de/normen-technik/klimakarte/";
const PLZ=new Map(); // plz → {plz, te, ort, src:"hand"|"import", t}
const plzOk=v=>/^\d{5}$/.test(String(v??"").trim());
async function plzLoad(){ if(!db) return; try{ (await tx("readonly",s=>s.getAll(),"plz")||[]).forEach(e=>PLZ.set(e.plz,e)) }catch(e){} }
async function plzPut(list){ list.forEach(e=>PLZ.set(e.plz,e)); if(!db||!list.length) return; try{ await tx("readwrite",s=>{list.forEach(e=>s.put(e))},"plz") }catch(e){} }
// θe aus der Tabelle setzen, solange der Wert nicht von Hand geändert wurde
function plzApply(p){ const e=PLZ.get(String(p.gebaeude.plz||"").trim()); if(!e) return false;
  const auto = p.klima.teSrc==="plz" || (!p.klima.teSrc && (p.klima.te==="-12"||p.klima.te===""));
  if(!auto||p.klima.te===e.te) return false;
  p.klima.te=e.te; p.klima.teSrc="plz"; return true; }
function plzParse(text){ const out=[];
  for(const line of text.replace(/^﻿/,"").split(/\r?\n/)){
    const cells=line.split(/[;\t]/.test(line)?/[;\t]/:",").map(c=>c.trim().replace(/^"|"$/g,"").trim().replace("−","-"));
    const pc=cells.find(c=>/^\d{4,5}$/.test(c)); if(!pc) continue; // Excel streicht führende Nullen (01067 → 1067)
    const rest=cells.filter(c=>c!==pc);
    const tc=rest.find(c=>/^-?\d+([.,]\d+)?$/.test(c)&&num(c)>=-30&&num(c)<=10); if(tc==null) continue;
    out.push({plz:pc.padStart(5,"0"),te:tc.replace(".",","),ort:rest.find(c=>c&&isNaN(num(c)))||"",src:"import",t:Date.now()}); }
  return out; }
function csvPlz(){ const L=["PLZ;Ort;θe °C;Quelle"];
  [...PLZ.values()].sort((a,b)=>a.plz.localeCompare(b.plz)).forEach(e=>L.push([e.plz,e.ort,e.te,e.src==="import"?"Import":"vor Ort gemerkt"].map(csvCell).join(";")));
  return "﻿"+L.join("\r\n"); }

/* ============ Heizlast (vereinfacht nach DIN EN 12831-1) ============ */
function calc(p){
  const te=nz(p.klima.te,-12), duwb=nz(p.klima.duwb,0.05), fu=nz(p.klima.fu,0.5), fe=nz(p.klima.fe,0.6);
  const out={r:{},T:0,V:0,HL:0,A:0};
  for(const r of p.raeume){
    const ti=nz(r.ti,20), dT=ti-te, rr={b:{},T:0,V:0,HL:0,perm2:NaN};
    const gross={};
    for(const b of r.bt){ const a=num(b.a); gross[b.id]=( !isNaN(a)&&a>0 ? a : nz(b.b)*nz(b.h) ) * nz(b.anz,1); }
    for(const b of r.bt){
      let A=gross[b.id];
      if(!TYPES[b.typ]?.open){ for(const o of r.bt){ if(o.in===b.id && TYPES[o.typ]?.open) A-=gross[o.id]; } }
      A=Math.max(0,A);
      let f=1, wb=duwb;
      if(b.adj==="unbeheizt") f=fu;
      else if(b.adj==="erdreich") f=fe;
      else if(b.adj==="beheizt"){ const tn=num(b.tn); f = (isNaN(tn)||dT===0)?0:(ti-tn)/dT; wb=0; }
      const U=nz(b.u), phi=A*(U+wb)*f*dT;
      rr.b[b.id]={A,phi}; rr.T+=phi;
    }
    const vol=nz(r.fl)*nz(r.h,2.5);
    rr.V=0.34*vol*nz(r.n,0.5)*dT;
    rr.HL=rr.T+rr.V; rr.perm2=nz(r.fl)>0?rr.HL/nz(r.fl):NaN;
    out.r[r.id]=rr; out.T+=rr.T; out.V+=rr.V; out.HL+=rr.HL; out.A+=nz(r.fl);
  }
  out.perm2=out.A>0?out.HL/out.A:NaN;
  return out;
}

    if(h>0&&(h<1.8||h>4)) add("i",`Lichte Höhe ${fmt(h,2)} m ungewöhnlich`,r);
    for(const b of r.bt){ const T=TYPES[b.typ], u=num(b.u), A=grossA(b);
      if(!(u>0)) add("f",`${btLabel(b)}: U-Wert fehlt`,r,b);
      else if(u<0.1||u>6) add("w",`${btLabel(b)}: U-Wert ${fmt(u,2)} W/m²K unplausibel`,r,b);
      if(!(A>0)) add("w",`${btLabel(b)}: Fläche fehlt`,r,b);
      if(b.adj==="beheizt"&&isNaN(num(b.tn))) add("w",`${btLabel(b)}: θ Nachbar fehlt – zählt mit 0 W`,r,b);
      if(T.open){ const w=r.bt.find(o=>o.id===b.in);
        if(!w){ if(r.bt.some(o=>!TYPES[o.typ].open&&["aw","da","iw"].includes(o.typ))) add("w",`${btLabel(b)}: keiner Wand zugeordnet – wird nicht abgezogen`,r,b); }
        else if(w.ri&&b.ri&&w.ri!==b.ri) add("i",`${btLabel(b)}: Richtung ${b.ri}, Wand ${w.ri}`,r,b); }
      else { const oa=r.bt.filter(o=>o.in===b.id&&TYPES[o.typ]?.open).reduce((s,o)=>s+grossA(o),0);
        if(oa>A+1e-9&&A>0) add("f",`${btLabel(b)}: Fenster/Türen ${fmt(oa,2)} m² größer als die Wand ${fmt(A,2)} m²`,r,b); } }
    if(fl>0) for(const [ty,lab] of [[["kd","bp"],"Boden"],[["og"],"Oberste Geschossdecke"]]){
      const a=r.bt.filter(b=>ty.includes(b.typ)).reduce((s,b)=>s+grossA(b),0);
      if(a>0&&Math.abs(a/fl-1)>0.2) add("i",`${lab} ${fmt(a,1)} m², Grundfläche ${fmt(fl,1)} m²`,r); }
    if(fl>0&&x.HL/fl>250) add("w",`Sehr hohe Heizlast ${fmt(x.HL/fl,0)} W/m² – Flächen und U-Werte prüfen`,r);
    if(hkAny&&x.HL>0&&!(r.hk||[]).length&&r.fbh!=="ja") add("i","Kein Heizkörper erfasst",r);
    if(ein.length>1&&!weOf(p,r)) add("w","Keiner Wohneinheit zugeordnet",r); }
  if(!jahrOk(p.gebaeude.baujahr)) add("i","Baujahr fehlt – U-Werte werden nicht nach Baualtersklasse vorbelegt");
  const wfl=num(p.gebaeude.wfl);
  if(!(wfl>0)) add("i","Wohnfläche fehlt – die Verbrauchs-Gegenprüfung kann nicht hochrechnen");
  else if(sumFl>wfl*1.1) add("w",`Räume zusammen ${fmt(sumFl,1)} m², Wohnfläche nur ${fmt(wfl,1)} m²`);
  if(!p.klima.teSrc&&p.klima.te==="-12") add("i","Norm-Außentemperatur steht noch auf dem Standardwert −12 °C");
  const v=verbCheck(p,c); if(v&&v.phiR>0&&isFinite(v.abw)&&Math.abs(v.abw)>0.5) add("w",`Heizlast weicht ${v.abw>0?"+":""}${fmt(v.abw*100,0)} % vom Verbrauch ab – siehe Gegenprüfung`);
  return L.sort((a,b)=>"fwi".indexOf(a.lvl)-"fwi".indexOf(b.lvl)); }

  const rows=["aw","da","og","kd","bp","fe","tu"].map(k=>{ const v=uTab(p,k), v0=uTab(p,k,true), s=uv.san?.[k]||{}, bj=k==="fe"?fj:jahrOk(s.bj), d=num(s.d);

function hkSection(r,idx,phi){ const hk=r.hk||[];
  return `<section class="block"><div class="block-head"><h2>Heizkörper</h2><span class="muted" style="font-size:.85rem">Normleistung vom Typenschild – bei Flachheizkörpern sonst aus Typ und Maßen geschätzt.</span></div>
    <div class="bts">${hk.map(h=>hkRow(r,h)).join("")||`<div class="empty">Noch keine Heizkörper erfasst.</div>`}</div>
    <div class="addbar"><button class="btn small" data-act="hknew">${I.plus}Heizkörper</button>
      <label class="chk"><input type="checkbox" data-bind="raeume.${idx}.fbh"${r.fbh==="ja"?" checked":""}>Fußbodenheizung in diesem Raum</label></div>
    <div class="note plzhint" id="hksum" style="margin-top:12px">${hkSum(r,phi)}</div></section>`; }
function hkSum(r,phi){ const p=S.cur, tv=wpZiel(p), sp=wpSpr(p), w=wpRooms(p,calc(p)).find(x=>x.r===r);
  if(!(phi>0)) return "Keine Heizlast – erst Bauteile erfassen.";
  if(w.st==="fbh") return "Fußbodenheizung: wird für die Vorlauftemperatur nicht berechnet.";
  if(w.st==="ohne") return `Raumheizlast ${fmt(phi,0)} W – noch kein Heizkörper erfasst.`;
  if(w.st==="unvollst") return `Bei mindestens einem Heizkörper fehlt die Leistung (Maße oder Normleistung eintragen).`;
  const vl=isFinite(w.vl)?fmt(Math.ceil(w.vl),0)+" °C":"über 90 °C";
  return `Raumheizlast <b>${fmt(phi,0)} W</b> · Heizkörper bei ${fmt(tv,0)}/${fmt(tv-sp,0)} °C: <b>${fmt(w.qz,0)} W</b> (${fmt(w.deck*100,0)} %) · nötige Vorlauftemperatur <b>${vl}</b>`+
    (w.st==="tausch"?`<br>Für ${fmt(tv,0)} °C nötig: Heizkörper mit zusammen ca. <b>${fmt(Math.ceil(w.need/50)*50,0)} W</b> Normleistung (75/65/20), vorhanden ${fmt(w.qn,0)} W.`:""); }
function hkResTxt(r,h){ const N=hkNorm(h), p=S.cur, tv=wpZiel(p), sp=wpSpr(p);
  if(!(N.q>0)) return h.typ==="glied"?"Glieder und Leistung je Glied oder Normleistung eintragen":isFlach(h.typ)?"Länge und Bauhöhe (300–900 mm) oder Normleistung eintragen":"Normleistung eintragen";
  return `Qn <output>${fmt(N.q,0)}</output> W${N.src==="tabelle"?" (geschätzt)":""} · n ${fmt(N.n,2)} · bei ${fmt(tv,0)}/${fmt(tv-sp,0)} °C <output>${fmt(hkQ(h,tv,tv-sp,nz(r.ti,20)),0)}</output> W`; }
function hkRow(r,h){ const N=hkNorm(h), tab=hkTab(h.typ,num(h.h)), f=(lab,k,o={})=>`<label class="f${o.w2?" w2":""}"><span>${lab}${o.unit?` <span class="unit">${o.unit}</span>`:""}</span>${o.opts

    :`<input class="in" inputmode="decimal" data-hf="${k}" value="${esc(h[k]??"")}"${o.ph?` placeholder="${esc(o.ph)}"`:""}>`}</label>`;
  return `<div class="bt" data-hk="${h.id}"><div class="bt-top">
      <select class="in" data-hf="typ" aria-label="Heizkörpertyp">${HK_TYP.map(([k,l])=>`<option value="${k}"${k===h.typ?" selected":""}>${l}</option>`).join("")}</select>

      ${f("Länge","l",{unit:"mm"})}${f("Bauhöhe","h",{unit:"mm"})}
      ${h.typ==="glied"?f("Glieder","anz")+f("Leistung je Glied","qg",{unit:"W"}):""}
      ${f("Normleistung","qn",{unit:"W",ph:N.src==="tabelle"?"≈ "+fmt(N.q,0):"Typenschild"})}
      ${f("Angabe bezogen auf","norm",{w2:true,opts:[["75","75/65/20 °C (EN 442)"],["90","90/70/20 °C (alt, DIN 4703)"]]})}
      ${f("Exponent n","n",{ph:fmt(tab?tab.n:1.3,2)})}
    </div>
    <div class="bt-res"><span data-hkres>${hkResTxt(r,h)}</span><span class="sp"></span>
      <button class="btn small ghost" data-act="hkdup">Duplizieren</button><button class="btn small ghost danger" data-act="hkdel" aria-label="Heizkörper löschen">${I.trash}</button></div></div>`; }

/* ---- Gegenprüfung über den Verbrauch ----
   Φ_Verbrauch = (Ø Verbrauch × Heizwert × Nutzungsgrad − Warmwasser-Nutzwärme) / Vollbenutzungsstunden.
   Richtwerte, im Projekt überschreibbar (anlage.vHw, vEta, vJaz, vWw, vVbh). */
function verbHw(p,e){ return {kWh:1,"m³":10,l:p.anlage.traeger==="Flüssiggas"?6.6:10,kg:4.8,Rm:1800}[e]??NaN; }
function verbEta(erz){ if(/Wärmepumpe/.test(erz)) return NaN; if(/Brennwert/.test(erz)) return 0.90; if(/Niedertemperatur/.test(erz)) return 0.85;
  if(/Konstanttemperatur/.test(erz)) return 0.75; if(/Pellet|Holz/.test(erz)) return 0.80; if(/Fernwärme/.test(erz)) return 0.95;
  if(/Nachtspeicher|Elektro/.test(erz)) return 1.0; return 0.85; }
// Warmwasser nur abziehen, wenn es über dieselbe Anlage bereitet wird
const wwUeberHeizung=a=>/^zentral/.test(a.ww||"")&&a.wwSep!=="ja";
function verbCheck(p,c){ const a=p.anlage, wp=/Wärmepumpe/.test(a.erz||"");
  const jahre=[1,2,3].map(i=>({j:a["v"+i+"j"],m:num(a["v"+i+"m"]),e:a["v"+i+"e"]||"kWh"})).filter(x=>x.m>0);
  if(!jahre.length) return null;
  const hwIn=num(a.vHw), kwh=jahre.map(x=>x.m*(hwIn>0?hwIn:verbHw(p,x.e))), avg=kwh.reduce((s,v)=>s+v,0)/kwh.length;
  const eta=wp?(num(a.vJaz)>0?num(a.vJaz):3):(num(a.vEta)>0?num(a.vEta):verbEta(a.erz||""));
  const wfl=num(p.gebaeude.wfl), wwDef=wwUeberHeizung(a)&&wfl>0?12.5*wfl:0, ww=num(a.vWw)>=0&&a.vWw!==""&&a.vWw!=null?num(a.vWw):wwDef;
  const vbh=num(a.vVbh)>0?num(a.vVbh):2000, q=avg*eta-ww, phiV=q/vbh*1000;

function verbSection(p){

    case "rdel": { const r=curRoom(); if(S.armed===r.id){ S.cur.raeume=S.cur.raeume.filter(x=>x!==r); S.cur.fotos.forEach(f=>{if(f.ref===r.id)f.ref="geb"}); S.room=null; S.armed=null; touch(); toast("Raum gelöscht"); } else S.armed=r.id; render(); break; }
    case "btnew": { const r=curRoom(); const t=el.dataset.typ; const ex={};
      if(TYPES[t].open){ const w=[...r.bt].reverse().find(o=>o.typ==="aw"); if(w){ex.in=w.id; ex.ri=w.ri} }
      if(["og","kd","bp","dn"].includes(t)&&nz(r.fl)) ex.a=r.fl;
      if(t==="aw"||t==="iw") ex.h=r.h;
      r.bt.push(newBt(t,ex)); touch(); render(); break; }
    case "btopen": { const r=curRoom(), w=r.bt.find(x=>x.id===el.closest("[data-bt]").dataset.bt); if(!w) break;
      const o=newBt(el.dataset.typ,{in:w.id,ri:w.ri,bez:w.typ==="da"?"Dachfenster":""}); r.bt.push(o); touch(); render();
      $(`[data-bt="${o.id}"] [data-bf="b"]`)?.focus(); break; }
    case "hknew": { const r=curRoom(); r.hk=r.hk||[]; const prev=r.hk.at(-1); const h=newHk(); if(prev) Object.assign(h,{typ:prev.typ,h:prev.h}); r.hk.push(h); touch(); render();
      $(`[data-hk="${h.id}"] [data-hf="l"]`)?.focus(); break; }
    case "hkdup": { const r=curRoom(), id=el.closest("[data-hk]").dataset.hk, h=r.hk.find(x=>x.id===id); r.hk.splice(r.hk.indexOf(h)+1,0,Object.assign({},h,{id:uid()})); touch(); render(); break; }
    case "hkdel": { const r=curRoom(), id=el.closest("[data-hk]").dataset.hk; r.hk=r.hk.filter(x=>x.id!==id); touch(); render(); break; }
    case "btdup": { const r=curRoom(); const id=el.closest("[data-bt]").dataset.bt; const b=r.bt.find(x=>x.id===id); const c=Object.assign({},b,{id:uid()}); r.bt.splice(r.bt.indexOf(b)+1,0,c); touch(); render(); break; }
    case "btdel": { const r=curRoom(); const id=el.closest("[data-bt]").dataset.bt; r.bt=r.bt.filter(x=>x.id!==id); r.bt.forEach(b=>{if(b.in===id)b.in=""}); touch(); render(); break; }
    case "phdel": { const id=el.closest("[data-ph]").dataset.ph; S.cur.fotos=S.cur.fotos.filter(f=>f.id!==id); touch(); render(); break; }
    case "xjson": deliver(fname(S.cur,"json"),JSON.stringify({app:"aufmass-heizlast",version:1,exported:new Date().toISOString(),project:S.cur,plz:[...PLZ.values()],briefkopf:bkGet()},null,1),"application/json"); break;
    case "plzsave": { const k=String(S.cur.gebaeude.plz).trim(); if(!plzOk(k)||isNaN(num(S.cur.klima.te))) break;
      await plzPut([{plz:k,te:S.cur.klima.te.trim(),ort:S.cur.gebaeude.ort||"",src:"hand",t:Date.now()}]); S.cur.klima.teSrc="plz"; touch(); paintPlz(); toast("θe für PLZ "+k+" gemerkt"); break; }
    case "plzuse": { const e=PLZ.get(String(S.cur.gebaeude.plz).trim()); if(!e) break; S.cur.klima.te=e.te; S.cur.klima.teSrc="plz"; touch(); render(); break; }
    case "plzexport": deliver("plz-norm-aussentemperatur_"+today()+".csv",csvPlz(),"text/csv;charset=utf-8"); break;
    case "xcsvb": deliver(fname(S.cur,"bauteile.csv"),csvBauteile(S.cur),"text/csv;charset=utf-8"); break;
    case "xcsvr": deliver(fname(S.cur,"raeume.csv"),csvRaeume(S.cur),"text/csv;charset=utf-8"); break;
    case "protokoll": prDialog(); break;
    case "prgo": { const o={}; document.querySelectorAll("[data-pr]").forEach(c=>o[c.dataset.pr]=c.checked); try{ localStorage.setItem("aufmass.protokoll",JSON.stringify(o)) }catch(e){}
      $("#layer").innerHTML=""; prPrint(o); break; }
    case "bkedit": bkDialog(); break;
    case "bklogodel": { const b=bkGet(); b.logo=""; bkSet(b); $("#bklogo").outerHTML=bkLogoBox(b); if(!S.cur) render(); break; }
    case "bksave": { const b=bkGet(); document.querySelectorAll("[data-bk]").forEach(i=>b[i.dataset.bk]=i.value.trim()); if(bkSet(b)){ $("#layer").innerHTML=""; toast("Briefkopf gespeichert"); if(!S.cur) render(); } break; }
    case "close": if(e.target===el) $("#layer").innerHTML=""; break;
    case "copyx": { const ta=$("#xtext"); try{ await navigator.clipboard.writeText(ta._full||ta.value); toast("Kopiert"); }catch(err){ ta.removeAttribute("readonly"); ta.focus(); ta.select(); toast("Text markiert – jetzt kopieren"); } break; }
  }
});
app.addEventListener("toggle",e=>{ if(e.target.classList.contains("geo")) S.geoOpen=e.target.open; },true);
app.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.classList.contains("pcard")) e.target.click(); });
document.addEventListener("focusin",e=>{ if(isLenField(e.target)) L.field=fieldSel(e.target); });
document.addEventListener("change",async e=>{ if(e.target.dataset.act==="lasernext") L.next=e.target.checked;
  if(e.target.dataset.act==="bklogo"){ const f=e.target.files[0]; e.target.value=""; if(!f) return;
    try{ const b=bkGet(); b.logo=await bkLogoLoad(f); if(!bkSet(b)) return; $("#bklogo").outerHTML=bkLogoBox(b); if(!S.cur) render(); toast("Logo gespeichert"); }
    catch(err){ toast("Logo: "+err.message); } } });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&S.cur){ clearTimeout(saveT); dbPut(S.cur) } });

/* ============ Start ============ */
(async function init(){
  try{ db=await idbOpen(); storageOk=true; try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){} }catch(e){ db=null; storageOk=false; }
  S.projects=await dbAll(); await plzLoad();
  let seeded=false; try{ seeded=localStorage.getItem("aufmass.seeded")==="1" }catch(e){}
  if(!S.projects.length&&!seeded){ const p=sample(); await dbPut(p); S.projects=[p]; try{localStorage.setItem("aufmass.seeded","1")}catch(e){} }
  document.body.insertAdjacentHTML("beforeend",Object.entries(UPRESET).map(([k,l])=>`<datalist id="u-${k}">${l.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</datalist>`).join(""));
  render();
})();
</script>

<script>
// Service Worker: beim Start und beim Zurückkehren in die App nach Updates suchen. Übernimmt ein neuer
// Service Worker die Seite, läuft noch die alte Version – dann Hinweis mit „Neu laden“ zeigen.
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}) });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadController) showUpdate(); });
}
// Passwortschutz (Cloudflare): Ist die Anmeldung abgelaufen, kommen keine Updates mehr an – dann Hinweis zeigen.
// Lokal (ohne Middleware) antwortet /__auth mit 404 und es passiert nichts.
function checkAuth(){ if(!navigator.onLine) return;
  fetch("/__auth",{cache:"no-store",credentials:"same-origin"}).then(r=>{ if(r.status===401&&!document.getElementById("authbar"))
    document.body.insertAdjacentHTML("beforeend",'<div class="updbar noprint" id="authbar" role="status"><span>Anmeldung abgelaufen – für Updates neu anmelden.</span><a class="btn small primary" href="/login">Anmelden</a></div>'); }).catch(()=>{}); }
checkAuth(); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkAuth() });
</script>
